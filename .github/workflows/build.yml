name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore NcaaTranslator.sln

    - name: Build
      run: dotnet build NcaaTranslator.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test NcaaTranslator.sln --no-build --verbosity normal --configuration Release

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.10.2

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Restore dependencies
      run: dotnet restore NcaaTranslator.sln

    - name: Build
      run: dotnet build NcaaTranslator.sln --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }} /p:SkipUiBuild=false

    - name: Publish
      run: dotnet publish src/NcaaTranslator.Desktop/NcaaTranslator.Desktop.csproj --configuration Release --output ./artifacts --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }} /p:SkipUiBuild=false

    - name: Create ZIP
      run: |
        cd ./artifacts
        Compress-Archive -Path .\* -DestinationPath ..\NcaaTranslator-${{ steps.gitversion.outputs.semVer }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Automatic release created by GitHub Actions.
          Version: ${{ steps.gitversion.outputs.semVer }}
        draft: false
        prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
        files: ./NcaaTranslator-${{ steps.gitversion.outputs.semVer }}.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: ./artifacts/
