name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Test updater
      run: dotnet test tests/NcaaTranslator.UpdateTests/NcaaTranslator.UpdateTests.csproj --configuration Release

    - name: Restore dependencies
      run: dotnet restore NcaaTranslator.sln

    - name: Build
      run: dotnet build NcaaTranslator.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test NcaaTranslator.sln --no-build --verbosity normal --configuration Release

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.8.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Test updater
      run: dotnet test tests/NcaaTranslator.UpdateTests/NcaaTranslator.UpdateTests.csproj --configuration Release

    - name: Restore dependencies
      run: dotnet restore NcaaTranslator.sln

    - name: Build
      run: dotnet build NcaaTranslator.sln --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.semVer }} /p:SkipUiBuild=false

    - name: Publish
      run: dotnet publish src/NcaaTranslator.Desktop/NcaaTranslator.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output ./artifacts /p:Version=${{ steps.gitversion.outputs.semVer }} /p:SkipUiBuild=false

    - name: Create ZIP
      run: |
        cd ./artifacts
        Compress-Archive -Path .\* -DestinationPath ..\NcaaTranslator-${{ steps.gitversion.outputs.semVer }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ steps.gitversion.outputs.semVer }}
        name: Release v${{ steps.gitversion.outputs.semVer }}
        body: |
          Automatic release created by GitHub Actions.
          Version: ${{ steps.gitversion.outputs.semVer }}
        draft: false
        prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
        files: ./NcaaTranslator-${{ steps.gitversion.outputs.semVer }}.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: ./artifacts/
